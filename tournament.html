<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V7PADEL Antalya · Turnuva tamamlandı</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="Bu turnuva tamamlandı. Bir sonraki etkinliğimiz çok yakında.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050d1c;--card:#0B1F3A;--line:rgba(255,255,255,.10);--txt:#F2F6FA;--txt2:#8A9BAD;--acc:#C9E82B}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:28px 20px;line-height:1.6;
  background-image:radial-gradient(1100px 520px at 50% -10%,rgba(201,232,43,.09),transparent 60%)}
.wrap{width:100%;max-width:620px;text-align:center}
.langs{display:flex;gap:6px;justify-content:center;margin-bottom:34px}
.langs button{background:transparent;border:1px solid var(--line);color:var(--txt2);
  font:600 12px/1 'DM Sans',sans-serif;letter-spacing:.08em;padding:8px 13px;border-radius:999px;cursor:pointer;
  transition:all .15s}
.langs button:hover{color:var(--txt);border-color:rgba(255,255,255,.28)}
.langs button.on{background:var(--acc);border-color:var(--acc);color:#0A1020}
.mark{font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.26em;color:var(--acc);
  text-transform:uppercase;margin-bottom:22px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(34px,8vw,58px);line-height:1.02;letter-spacing:.01em;margin-bottom:16px}
.sub{color:var(--txt2);font-size:clamp(15px,2.4vw,17px);max-width:460px;margin:0 auto 34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;text-align:left}
.card .t{font:700 11px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);margin-bottom:10px}
.card .b{color:var(--txt2);font-size:14.5px}
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:18px;background:var(--acc);color:#0A1020;
  font:700 14px/1 'DM Sans',sans-serif;padding:14px 24px;border-radius:999px;text-decoration:none;
  transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.foot{margin-top:34px;color:var(--txt2);font-size:12.5px;letter-spacing:.03em}
.foot a{color:var(--txt2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="langs" id="langs">
    <button data-l="tr">TR</button><button data-l="en">EN</button>
    <button data-l="ru">RU</button><button data-l="ua">UA</button>
  </div>

  <div class="mark" data-k="mark"></div>
  <h1 data-k="h1"></h1>
  <p class="sub" data-k="sub"></p>

  <div class="card">
    <div class="t" data-k="nextT"></div>
    <div class="b" data-k="nextB"></div>
    <a class="cta" id="cta" href="/tr/birthday-week"><span data-k="cta"></span> →</a>
  </div>

  <div class="foot">
    V7PADEL Antalya · <a href="https://www.instagram.com/v7padel_antalya/" target="_blank" rel="noopener">Instagram</a>
  </div>

</div>

<script>
/* Заглушка страницы турнира (Оля 13.08): турнир 23–24 мая прошёл, ссылка на него
   продолжает ходить по чатам. Вместо мёртвой страницы — честное «событие завершилось»
   и переход на ближайшее. Четыре языка, как на всех клиентских страницах. */
var T = {
  tr:{mark:"V7PADEL ANTALYA",
      h1:"Turnuva tamamlandı",
      sub:"Bu etkinlik sona erdi. İlgilendiğiniz için teşekkür ederiz — çok yakında yenisi geliyor.",
      nextT:"Sırada ne var",
      nextB:"28 Ağustos Cuma · YEAR ONE BY V7 — kulübümüzün ilk yaş günü akşamı. Kortlar, DJ, hediyeler ve çekiliş.",
      cta:"Davetiyeye göz atın", title:"V7PADEL Antalya · Turnuva tamamlandı"},
  en:{mark:"V7PADEL ANTALYA",
      h1:"This tournament has ended",
      sub:"The event is over. Thank you for your interest — the next one is coming very soon.",
      nextT:"What's next",
      nextB:"Friday, 28 August · YEAR ONE BY V7 — our club's first birthday evening. Courts, DJ, gifts and a lottery.",
      cta:"See the invitation", title:"V7PADEL Antalya · Tournament has ended"},
  ru:{mark:"V7PADEL ANTALYA",
      h1:"Турнир завершён",
      sub:"Событие уже прошло. Спасибо за интерес — совсем скоро будет следующее.",
      nextT:"Что дальше",
      nextB:"Пятница, 28 августа · YEAR ONE BY V7 — первый день рождения клуба. Корты, DJ, подарки и лотерея.",
      cta:"Открыть приглашение", title:"V7PADEL Antalya · Турнир завершён"},
  ua:{mark:"V7PADEL ANTALYA",
      h1:"Турнір завершено",
      sub:"Подія вже минула. Дякуємо за інтерес — зовсім скоро буде наступна.",
      nextT:"Що далі",
      nextB:"П'ятниця, 28 серпня · YEAR ONE BY V7 — перший день народження клубу. Корти, DJ, подарунки та лотерея.",
      cta:"Відкрити запрошення", title:"V7PADEL Antalya · Турнір завершено"}
};

function apply(l){
  var t = T[l] || T.tr;
  document.documentElement.lang = (l === 'ua' ? 'uk' : l);
  document.title = t.title;
  var nodes = document.querySelectorAll('[data-k]');
  for (var i = 0; i < nodes.length; i++){
    var k = nodes[i].getAttribute('data-k');
    if (t[k] != null) nodes[i].textContent = t[k];
  }
  document.getElementById('cta').setAttribute('href', '/' + l + '/birthday-week');
  var b = document.querySelectorAll('#langs button');
  for (var j = 0; j < b.length; j++) b[j].className = (b[j].getAttribute('data-l') === l ? 'on' : '');
  try { localStorage.setItem('v7online_lang', l); } catch(e){}
}

/* Язык: сохранённый выбор → язык браузера → турецкий (клуб в Анталье). */
(function(){
  var l = null;
  try { l = localStorage.getItem('v7online_lang'); } catch(e){}
  if (!T[l]) {
    var n = (navigator.language || 'tr').slice(0,2).toLowerCase();
    l = (n === 'uk' ? 'ua' : (T[n] ? n : 'tr'));
  }
  apply(l);
  document.getElementById('langs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (b) apply(b.getAttribute('data-l'));
  });
})();
</script>
</body>
</html>
