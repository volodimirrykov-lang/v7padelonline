<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YEAR ONE BY V7 · Prize Draw</title>
<style>
/* Экран для телевизора на вечеринке. ЯЗЫК ЭКРАНА — АНГЛИЙСКИЙ (Володимир 18.08):
   гости в Анталье читают латиницу. Названия подарков тоже приходят английские —
   отдельной колонкой из кабинета.

   Победителей выбирает СЕРВЕР. Кнопки здесь появляются только по ссылке с ключом
   ведущего и лишь ПРОСЯТ сервер крутить: «выиграть» подкруткой в консоли нельзя.
   Шрифты системные намеренно: на вечеринке интернет может подвести, а экран
   должен выглядеть одинаково всегда. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#061514;color:#f2eee3;
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
body{overflow-x:hidden}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:3vh 3vw 9vh;position:relative}
.eyebrow{font-size:clamp(12px,1.4vw,22px);font-weight:800;letter-spacing:.34em;color:#e5ff2b;text-transform:uppercase}
h1{font-size:clamp(38px,7.4vw,140px);font-weight:900;line-height:.92;letter-spacing:-.02em;margin:1.6vh 0}
h1 em{font-style:normal;color:#e5ff2b}
.off{color:#8fa196;font-size:clamp(13px,1.5vw,23px);margin-top:1vh}
.dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#e5ff2b;margin-right:.5em;
  animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}

/* ── список подарков по партнёрам ─────────────────────────────────────── */
.gifts{width:min(1600px,96vw);margin-top:3vh;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.gcard{border:1px solid #1d3330;background:#0b1f1d;padding:16px 18px;text-align:left;
  display:flex;flex-direction:column;gap:8px}
.gcard.done{opacity:.42}
.gcard h3{font-size:clamp(15px,1.5vw,24px);font-weight:900;letter-spacing:.02em;color:#f2eee3}
.gcard .cnt{font-size:clamp(10px,.95vw,15px);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:#e5ff2b}
.gcard.done .cnt{color:#7f9189}
.gcard ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.gcard li{font-size:clamp(12px,1.05vw,17px);color:#b9c9c1;line-height:1.35}
.gcard li b{color:#e5ff2b;font-weight:800}
.spin-btn{margin-top:6px;border:none;cursor:pointer;background:#e5ff2b;color:#061514;
  font:900 clamp(13px,1.2vw,19px)/1 inherit;letter-spacing:.14em;text-transform:uppercase;
  padding:14px 18px;font-family:inherit}
.spin-btn:hover{background:#f2ff7a}
.spin-btn[disabled]{opacity:.45;cursor:default}

/* ── прокрут и победители ─────────────────────────────────────────────── */
.prize{font-size:clamp(18px,2.6vw,46px);font-weight:900;color:#e5ff2b;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:1vh}
.roll{font-size:clamp(34px,7vw,130px);font-weight:900;line-height:1;color:#f2eee3;min-height:1.1em}
.roll.spin{opacity:.62;filter:blur(.4px)}
.wins{width:min(1600px,96vw);margin-top:2.4vh;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.win{display:flex;align-items:center;gap:14px;background:#0b1f1d;border:1px solid #1d3330;
  padding:12px 16px;text-align:left;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.win .tk{font-family:ui-monospace,"Courier New",monospace;font-weight:900;color:#061514;
  background:#e5ff2b;padding:.3em .6em;font-size:clamp(12px,1.1vw,18px);white-space:nowrap}
.win .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.win .who{font-size:clamp(15px,1.5vw,26px);font-weight:900;line-height:1.15}
.win .what{font-size:clamp(11px,1vw,16px);color:#9fb0a6}
.left-note{margin-top:1.6vh;color:#c9a227;font-size:clamp(12px,1.15vw,18px);font-weight:700}

/* ── служебное ─────────────────────────────────────────────────────────── */
.foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:12px 3vw;background:linear-gradient(0deg,#061514,#06151400);
  font-size:clamp(10px,1.05vw,17px);color:#6f847a;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ctl{display:flex;gap:8px}
.ctl button{border:1px solid #2b4540;background:transparent;color:#9fb0a6;cursor:pointer;
  font:800 clamp(9px,.9vw,13px)/1 inherit;letter-spacing:.12em;text-transform:uppercase;
  padding:9px 12px;font-family:inherit}
.ctl button:hover{border-color:#e5ff2b;color:#e5ff2b}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">V7 PADEL ANTALYA · YEAR ONE</p>
  <div id="stage"></div>
</div>
<div class="foot">
  <span id="pool"></span>
  <span class="ctl" id="ctl"></span>
  <span>28.08 · V7PADEL.ONLINE</span>
</div>

<script>
(function(){
  var API='https://api.rex.v7padel.club/api/birthday/draw';
  var KEY=(new URLSearchParams(location.search).get('k')||'').trim();
  var Q=KEY?('?k='+encodeURIComponent(KEY)):'';
  var stage=document.getElementById('stage'), pool=document.getElementById('pool'),
      ctl=document.getElementById('ctl');
  var NAMES=[], lastRound=null, rolling=null, busy=false, D=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  /* В барабан подарок «десять ваучеров» уходит десятью строками «… · 1/10».
     Человеку на экране этот хвост не нужен — показываем «Car wash voucher × 10». */
  function base(t){ return String(t||'').replace(/\s*·\s*\d+\/\d+\s*$/,''); }
  function groupTitles(items){
    var o=[], m={};
    (items||[]).forEach(function(it){
      var b=base(it.title);
      if(!m[b]){ m[b]={title:b, n:0}; o.push(m[b]); }
      m[b].n++;
    });
    return o;
  }

  function idle(d){
    var gs=(d&&d.groups)||[];
    var html='<h1>YEAR <em>ONE</em><br>BY V7</h1>'
      +'<p class="off"><span class="dot"></span>The prize draw is about to begin</p>';
    if(gs.length){
      html+='<div class="gifts">'+gs.map(function(g){
        var done=!g.left;
        return '<div class="gcard'+(done?' done':'')+'">'
          +'<h3>'+esc(g.partner)+'</h3>'
          +'<span class="cnt">'+(done?'all gifts drawn':(g.left+' gift'+(g.left>1?'s':'')))+'</span>'
          +'<ul>'+groupTitles(g.items).map(function(t){
              return '<li>'+esc(t.title)+(t.n>1?' <b>× '+t.n+'</b>':'')+'</li>'; }).join('')+'</ul>'
          +(d.can_spin && !done
             ? '<button class="spin-btn" data-partner="'+esc(g.partner)+'">Spin · '+g.left+' winner'+(g.left>1?'s':'')+'</button>'
             : '')
          +'</div>';
      }).join('')+'</div>';
    }
    stage.innerHTML=html;
  }

  /* Барабан крутит ИМЕНА, которые уже пришли с сервера: победители там уже
     выбраны, анимация только показывает. Совпадение в момент остановки — не
     подкрутка, мы просто показываем присланное. */
  function reveal(cur){
    var ws=cur.winners||[];
    var head='<p class="prize">'+esc(cur.partner)+' · '+ws.length+' winner'+(ws.length>1?'s':'')+'</p>';
    stage.innerHTML=head+'<div class="roll spin" id="roll">&nbsp;</div>';
    var el=document.getElementById('roll'), i=0, t0=Date.now();
    var src=NAMES.length?NAMES:ws.map(function(w){return w.name;});
    clearInterval(rolling);
    rolling=setInterval(function(){
      el.textContent=src[(i++)%src.length];
      if(Date.now()-t0>2600){
        clearInterval(rolling); rolling=null;
        stage.innerHTML=head+'<div class="wins">'+ws.map(function(w,ix){
          return '<div class="win" style="animation-delay:'+(ix*0.09)+'s">'
            +'<span class="tk">'+esc(w.ticket)+'</span>'
            +'<span class="txt"><span class="who">'+esc(w.name)+'</span>'
            +'<span class="what">'+esc(base(w.prize))+'</span></span></div>';
        }).join('')+'</div>'
        + (cur.left_over ? '<p class="left-note">'+cur.left_over+' gift'+(cur.left_over>1?'s':'')
            +' left undrawn — not enough tickets in the draw</p>' : '');
      }
    },70);
  }

  function controls(d){
    if(!d.can_spin){ ctl.innerHTML=''; return; }
    ctl.innerHTML='<button id="c-undo">Undo last spin</button>'
      +'<button id="c-idle">Title screen</button>';
  }

  function post(path, body, done){
    busy=true;
    fetch(API+path+Q,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
      .then(function(x){ busy=false; if(done) done(x); tick(); })
      .catch(function(){ busy=false; alert('No connection — try again'); });
  }

  document.addEventListener('click', function(e){
    var sp=e.target.closest('.spin-btn');
    if(sp && !busy){
      sp.disabled=true; sp.textContent='Spinning…';
      post('/spin',{partner:sp.getAttribute('data-partner')}, function(x){
        if(x.j && x.j.error){ alert(x.j.error); tick(); }
      });
      return;
    }
    if(e.target.id==='c-undo' && !busy){
      if(!confirm('Undo the last spin? The gifts go back to the pool.')) return;
      post('/undo',{},function(x){ if(x.j&&x.j.error) alert(x.j.error); lastRound=null; });
      return;
    }
    if(e.target.id==='c-idle' && !busy){
      post('/state',{state:'idle'},function(){ lastRound=null; });
      return;
    }
  });

  function tick(){
    fetch(API+Q,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) return;
      D=d; NAMES=d.names||[];
      pool.textContent='tickets in the draw: '+(d.pool_size||0);
      controls(d);
      var cur=d.current;
      if(d.state==='idle' || !cur){ lastRound=null; if(!rolling) idle(d); return; }
      if(cur.ts!==lastRound){ lastRound=cur.ts; reveal(cur); }
    }).catch(function(){});
  }
  tick(); setInterval(function(){ if(!busy) tick(); }, 2000);
})();
</script>
</body>
</html>
